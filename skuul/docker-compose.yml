services:
  # Laravel Application
  skuul-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sail-8.5/app:latest
    container_name: skuul-app
    ports:
      - "80:8000"
    env_file:
      - .env
    environment:
      - WWWUSER=1337
      - WWWGROUP=1000
      - PHP_IDE_CONFIG=serverName=skuul.local
      - LARAVEL_SAIL=1
      - DB_HOST=skuul-mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-skuul}
      - DB_USERNAME=${DB_USERNAME:-sail}
      - REDIS_HOST=skuul-redis
      - REDIS_PORT=6379
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=skuul-mailhog
      - MAIL_PORT=1025
    volumes:
      - .:/var/www/html:delegated
      - skuul-vendor:/var/www/html/vendor
      - skuul-node-modules:/var/www/html/node_modules
    networks:
      - skuul
    depends_on:
      skuul-mysql:
        condition: service_healthy
      skuul-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MySQL Database
  skuul-mysql:
    image: mysql:8.4
    container_name: skuul-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-skuul}
      MYSQL_USER: ${DB_USERNAME:-sail}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - skuul-mysql-data:/var/lib/mysql
    networks:
      - skuul
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --silent --host=127.0.0.1 --user=root"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis (cache, queue, sessions)
  skuul-redis:
    image: redis:7-alpine
    container_name: skuul-redis
    ports:
      - "6379:6379"
    volumes:
      - skuul-redis-data:/data
    networks:
      - skuul
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailHog (email testing)
  skuul-mailhog:
    image: mailhog/mailhog:latest
    container_name: skuul-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - skuul
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  skuul:
    driver: bridge

volumes:
  skuul-mysql-data:
    driver: local
  skuul-redis-data:
    driver: local
  skuul-vendor:
    driver: local
  skuul-node-modules:
    driver: local
